[package]
name = "zautomerge-oracle"
version = "0.1.0"
edition = "2021"
publish = false
description = "Differential-testing oracle which drives the upstream automerge implementation"

# The oracle is a standalone crate, not a member of any surrounding workspace.
[workspace]

[dependencies]
# The reference implementation, wired up by tools/link-oracle.sh through
# `vendor/automerge`. Nothing here is built by `zig build`; cargo is only
# needed for `zig build conformance`.
automerge = { path = "vendor/automerge" }
# The column codecs themselves, for the `codec` subcommand: the RLE, boolean
# and delta encoders, the prefix column, the slab metadata and the B-tree
# behind the delta column's value queries. `automerge` already depends on
# `hexane`, so this costs no new compilation, and it is a path dependency on
# the same read-only checkout `vendor/automerge` resolves to.
hexane = { path = "vendor/hexane" }
serde_json = "1"
